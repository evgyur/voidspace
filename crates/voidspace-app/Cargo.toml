[package]
name = "voidspace-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "voidspace"
path = "src/main.rs"
test = false

[[bin]]
name = "voidspace-smoke"
path = "src/bin/voidspace-smoke.rs"
test = false

[dependencies]
anyhow.workspace = true
crossbeam-channel.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
voidspace-filter = { path = "../voidspace-filter" }
voidspace-fileops = { path = "../voidspace-fileops" }
voidspace-export = { path = "../voidspace-export" }
voidspace-index = { path = "../voidspace-index" }
voidspace-layout = { path = "../voidspace-layout" }
voidspace-model = { path = "../voidspace-model" }
voidspace-scan = { path = "../voidspace-scan" }
voidspace-watch = { path = "../voidspace-watch" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0.11"
