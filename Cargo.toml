[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0"
bitflags = { version = "2.9", features = ["serde"] }
blake3 = "1.8"
ciborium = "0.2"
crossbeam-channel = "0.5"
csv = "1.3"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu"] }
egui = "0.36.1"
notify = "8.2"
parking_lot = "0.12"
proptest = "1.8"
rayon = "1.11"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallvec = { version = "1.15", features = ["serde"] }
tempfile = "3.21"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
trash = "5.2.6"
windows = "0.62.2"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1
